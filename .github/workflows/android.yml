name: Android build

on:
  push:
    branches:
      - main
      - step-1-usb-diagnostics
      - step-2-native-transport
      - step-3-live-preview
  pull_request:
    branches:
      - main
      - step-2-native-transport
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app with native UVC / FFmpeg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run host-side UVC frame assembler regression tests
        run: bash scripts/test-uvc-frame-assembler.sh

      - name: Build pinned FFmpeg 9.1 for arm64-v8a (LGPL shared libraries)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash scripts/build-ffmpeg-android.sh

      - name: Run unit tests and build arm64 APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload stage 3 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Panasonic-Monitor-step3-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
